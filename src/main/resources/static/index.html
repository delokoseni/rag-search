<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <title>RAG Chat</title>
        <link rel="stylesheet" href="style.css">
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    </head>
    <body>

        <div class="app">

            <aside class="sidebar">
                <div class="sidebar-title">История</div>

                <div class="chat-history">
                    <div class="history-item active">Новый чат</div>
                    <div class="history-item">Что такое RAG?</div>
                    <div class="history-item">Ollama настройка</div>
                </div>
            </aside>

            <main class="chat-container">

                <div class="messages" id="messages">
                    <div class="empty-state" id="emptyState">
                        Привет! Чем могу помочь?
                    </div>
                </div>

                <div class="input-area">
                    <textarea id="input" placeholder="Введите сообщение..." rows="1"></textarea>
                    <button id="sendBtn" aria-label="Отправить">
                        <svg
                                xmlns="http://www.w3.org/2000/svg"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2.5"
                                stroke-linecap="round"
                                stroke-linejoin="round">
                            <path d="M12 19V7"/>
                            <path d="M7 12l5-5 5 5"/>
                        </svg>
                    </button>
                </div>

            </main>

        </div>

        <script src="app.js"></script>
    </body>
</html>
